<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <header>
            <section class="banner">
                <img src="imagenes/banner1.webp" id="banner1">
            </section>
            <section class="navegacion">
                <nav>
                    <div class="logo">
                        <img src="imagenes/logo.webp" id="logo-imagen">
                    </div>
                    <div class="botones">
                        <div id="ubicacion">Inicio</div>
                        <div>Nosotros</div>
                        <div>Registro</div>
                    </div>
                </nav>
            </section>
        </header>
        <section class="primera-seccion">
            <div class="disposicion">
                <h6>Hola</h6>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aspernatur iure magni voluptate minus unde esse minima ratione laborum sapiente asperiores illo suscipit, voluptates laudantium corporis pariatur beatae iusto eius exercitationem!</p>
            </div>
            <div class="disposicion">segunda</div>
        </section>
        <section class="segunda-seccion">
            <div class="disposicion">primera</div>
            <div class="disposicion">segunda</div>
        </section>
        <footer>Footer</footer>
    </div>
</body>
</html>
